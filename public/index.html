<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>EDT - ISTY / UVSQ / Université Paris-Saclay</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --card-bg: transparent;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --fg: #f0f0f0;
      --muted: #9a9a9a;
      /* Le logo contient du texte noir/gris sur fond transparent : sans
         carte claire derrière, il perd tout contraste sur un fond sombre. */
      --card-bg: #ffffff;
    }
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .logo-card {
    background: var(--card-bg);
    padding: min(6vw, 32px);
    border-radius: 16px;
  }

  .logo {
    width: min(90vw, 640px);
    height: auto;
    display: block;
  }

  footer {
    text-align: center;
    padding: 16px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  footer a {
    color: inherit;
  }
</style>
</head>
<body>
  <main>
    <div class="logo-card">
      <img class="logo" src="/logo-isty-uvsq-paris-saclay.png" alt="ISTY - UVSQ - Université Paris-Saclay">
    </div>
  </main>
  <footer>
    © 2026 Théo Huguet - <a href="https://github.com/theohuguet01/uvsq-schedule-sync">github.com/theohuguet01/uvsq-schedule-sync</a>
  </footer>
</body>
</html>
