<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/png" href="/blason-uvsq-paris-saclay.png">
<title>Page introuvable - EDT UVSQ</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #17191b;
    --muted: #6F6F6E;
    --border: #d7dee1;
    --uvsq-teal-text: #007ba4;
    --uvsq-prune: #69043C;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: "Century Gothic", "Avenir Next", "Segoe UI", sans-serif;
  }

  .site-header {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
  }

  .site-header .logo {
    height: 40px;
    width: auto;
    display: block;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }

  .code {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--uvsq-teal-text);
    margin: 0 0 8px;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }

  p {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 20px;
  }

  a.home-link {
    display: inline-block;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--uvsq-teal-text);
    border-radius: 6px;
    padding: 9px 18px;
    text-decoration: none;
  }

  footer {
    text-align: center;
    padding: 10px;
    font-size: 0.8rem;
    background: var(--uvsq-prune);
    color: #e9d3de;
  }

  footer a {
    color: #fff;
  }
</style>
</head>
<body>
  <header class="site-header">
    <img class="logo" src="/blason-uvsq-paris-saclay.png" alt="UVSQ - Université Paris-Saclay">
  </header>
  <main>
    <div>
      <p class="code">Erreur 404</p>
      <h1>Cette page n'existe pas</h1>
      <p>Vérifiez le lien que vous avez suivi, ou repartez du formulaire d'inscription.</p>
      <a class="home-link" href="/">Aller au formulaire d'inscription</a>
    </div>
  </main>
  <footer>
    © 2026 Théo HUGUET - <a href="https://github.com/theohuguet01/uvsq-schedule-sync">github.com/theohuguet01/uvsq-schedule-sync</a>
  </footer>
</body>
</html>
